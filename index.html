  <!-- =================================================
      REGISTER MODAL
  ================================================= -->

  <div id="U9-register-modal">


<div id="U9-register-modal-content">


  <button
    id="U9-register-modal-close"
  >
    ×
  </button>


  <h2>
    Register
  </h2>


  <form
    id="U9-register-form"
  >


    <label
      for="U9-register-username"
    >
      Username
    </label>


    <input
      type="text"
      id="U9-register-username"
      name="username"
      autocomplete="username"
      required
    >


    <label
      for="U9-register-email"
    >
      Email
    </label>


    <input
      type="email"
      id="U9-register-email"
      name="email"
      autocomplete="email"
      required
    >


    <label
      for="U9-register-password"
    >
      Password
    </label>


    <div
      id="U9-register-password-wrapper"
    >

      <input
        type="password"
        id="U9-register-password"
        name="password"
        autocomplete="new-password"
        required
      >


      <button
        type="button"
        id="U9-register-password-toggle"
      >
        Show
      </button>

    </div>


    <label
      for="U9-register-confirm-password"
    >
      Confirm Password
    </label>


    <div
      id="U9-register-confirm-password-wrapper"
    >

      <input
        type="password"
        id="U9-register-confirm-password"
        name="confirm-password"
        autocomplete="new-password"
        required
      >


      <button
        type="button"
        id="U9-register-confirm-password-toggle"
      >
        Show
      </button>

    </div>


    <button
      type="submit"
      id="U9-register-submit"
    >
      Register
    </button>

  </form>

</div>


  </div>

<div id="U9-login-modal-content">

  <h2>

  <form
    id="U9-login-form"
  >


    <label
      for="U9-login-email"
    >
      Email
    </label>


    <input
      type="email"
      id="U9-login-email"
      name="email"
      autocomplete="email"
      required
    >


    <label
      for="U9-login-password"
    >
      Password
    </label>


    <div
      id="U9-login-password-wrapper"
    >

      <input
        type="password"
        id="U9-login-password"
        name="password"
        autocomplete="current-password"
        required
      >


      <button
        type="button"
        id="U9-login-password-toggle"
      >
        Show
      </button>

    </div>


    <button
      type="submit"
      id="U9-login-submit"
    >
      Login
    </button>

  </form>

</div>

    <button

      disabled
    >
      Yes

      <span id="U9-account-logout-countdown">
        5
      </span>
      )
    </button>

  </div>

</div>
